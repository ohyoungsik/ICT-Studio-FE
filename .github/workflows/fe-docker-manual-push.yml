name: FE Docker Manual Build and Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build -t ohyoungsik/ict-studio-fe:${{ github.event.inputs.image_tag }} .

      - name: Push Image
        run: |
          docker push ohyoungsik/ict-studio-fe:${{ github.event.inputs.image_tag }}

      - name: Configure AWS Credentials
        if: ${{ github.event.inputs.image_tag == 'latest' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Resolve App Auto Scaling Group
        if: ${{ github.event.inputs.image_tag == 'latest' }}
        id: app-asg
        env:
          APP_ASG_NAME: ${{ vars.APP_ASG_NAME }}
          ASG_TAG_ENVIRONMENT: ${{ vars.ASG_TAG_ENVIRONMENT || 'prod' }}
          ASG_TAG_ROLE: ${{ vars.ASG_TAG_ROLE || 'app' }}
          ASG_TAG_NAME: ${{ vars.ASG_TAG_NAME || 'prod-ict-private-app' }}
        run: |
          set -euo pipefail

          if [ -n "${APP_ASG_NAME}" ]; then
            echo "asg_name=${APP_ASG_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASG_NAME="$(
            aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?Tags[?Key=='Environment' && Value=='${ASG_TAG_ENVIRONMENT}'] && Tags[?Key=='Role' && Value=='${ASG_TAG_ROLE}'] && Tags[?Key=='Name' && Value=='${ASG_TAG_NAME}']].AutoScalingGroupName | [0]" \
              --output text
          )"

          if [ -z "${ASG_NAME}" ] || [ "${ASG_NAME}" = "None" ]; then
            echo "Could not resolve App Auto Scaling Group from repository variable APP_ASG_NAME or ASG tags." >&2
            exit 1
          fi

          echo "asg_name=${ASG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Start ASG Instance Refresh
        if: ${{ github.event.inputs.image_tag == 'latest' }}
        run: |
          set -euo pipefail

          IN_PROGRESS_REFRESH_ID="$(
            aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ steps.app-asg.outputs.asg_name }}" \
              --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress' || Status=='Cancelling' || Status=='RollbackInProgress'].InstanceRefreshId | [0]" \
              --output text
          )"

          if [ -n "${IN_PROGRESS_REFRESH_ID}" ] && [ "${IN_PROGRESS_REFRESH_ID}" != "None" ]; then
            echo "Instance refresh ${IN_PROGRESS_REFRESH_ID} is already in progress. Skipping new refresh."
            exit 0
          fi

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.app-asg.outputs.asg_name }}"
